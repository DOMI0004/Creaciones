<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores amarillas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
  <style>
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

:root {
  --dark-color: #000;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  background-color: var(--dark-color);
  overflow: hidden;
  perspective: 1000px;
}

.night {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  filter: blur(0.1vmin);
  background-image: radial-gradient(
      ellipse at top,
      transparent 0%,
      var(--dark-color)
    ),
    radial-gradient(
      ellipse at bottom,
      var(--dark-color),
      rgba(145, 233, 255, 0.2)
    ),
    repeating-linear-gradient(
      220deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    repeating-linear-gradient(
      189deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    repeating-linear-gradient(
      138deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px
    ),
    linear-gradient(
      45deg,
      rgb(0, 0, 0),
      rgb(0, 0, 0) 20%,
      transparent 20%,
      transparent 40%,
      rgb(0, 0, 0) 40%,
      rgb(0, 0, 0) 60%,
      transparent 60%,
      transparent 80%,
      rgb(0, 0, 0) 80%,
      rgb(0, 0, 0) 100%
    );
}

.flowers {
  position: relative;
  transform: scale(0.9);
}

.flower {
  position: absolute;
  bottom: 10vmin;
  transform-origin: bottom center;
  z-index: 10;
  --fl-speed: 0.8s;
}

.flower--1 {
  animation: moving-flower-1 4s linear infinite;
}

.flower--1 .flower__line {
  height: 70vmin;
  animation-delay: 0.3s;
}

.flower--1 .flower__line__leaf--1 {
  animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
}

.flower--1 .flower__line__leaf--2 {
  animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
}

.flower--1 .flower__line__leaf--3 {
  animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
}

.flower--1 .flower__line__leaf--4 {
  animation: blooming-leaf-left var(--fl-speed) 1s backwards;
}

.flower--1 .flower__line__leaf--5 {
  animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
}

.flower--1 .flower__line__leaf--6 {
  animation: blooming-leaf-left var(--fl-speed) 2s backwards;
}

.flower--2 {
  left: 50%;
  transform: rotate(20deg);
  animation: moving-flower-2 4s linear infinite;
}

.flower--2 .flower__line {
  height: 60vmin;
  animation-delay: 0.6s;
}

.flower--2 .flower__line__leaf--1 {
  animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
}

.flower--2 .flower__line__leaf--2 {
  animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
}

.flower--2 .flower__line__leaf--3 {
  animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
}

.flower--2 .flower__line__leaf--4 {
  animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
}

.flower--3 {
  left: 50%;
  transform: rotate(-15deg);
  animation: moving-flower-3 4s linear infinite;
}

.flower--3 .flower__line {
  animation-delay: 0.9s;
}

.flower--3 .flower__line__leaf--1 {
  animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
}

.flower--3 .flower__line__leaf--2 {
  animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
}

.flower--3 .flower__line__leaf--3 {
  animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
}

.flower--3 .flower__line__leaf--4 {
  animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
}

.flower__leafs {
  position: relative;
  animation: blooming-flower 2s backwards;
}

.flower__leafs--1 {
  animation-delay: 1.1s;
}

.flower__leafs--2 {
  animation-delay: 1.4s;
}

.flower__leafs--3 {
  animation-delay: 1.7s;
}

.flower__leafs::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  width: 8vmin;
  height: 8vmin;
  background-color: #fffb00;
  filter: blur(10vmin);
}

.flower__leaf {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 8vmin;
  height: 11vmin;
  border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
  background-color: #fffb00;
  background-image: linear-gradient(to top, #fffb00, #ffce00);
  transform-origin: bottom center;
  opacity: 0.9;
  box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
}

.flower__leaf--1 {
  transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
}

.flower__leaf--2 {
  transform: translate(-50%, -4%) rotateX(40deg);
}

.flower__leaf--3 {
  transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
}

.flower__leaf--4 {
  width: 8vmin;
  height: 8vmin;
  transform-origin: bottom left;
  border-radius: 4vmin 10vmin 4vmin 4vmin;
  transform: translate(-0%, 18%) rotateX(70deg) rotate(-43deg);
  background-image: linear-gradient(to top, #fffb00, #ffce00);
  z-index: 1;
  opacity: 0.8;
}

.flower__white-circle {
  position: absolute;
  left: -3.5vmin;
  top: -3vmin;
  width: 9vmin;
  height: 4vmin;
  border-radius: 50%;
  background-color: #fff;
}

.flower__white-circle::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  width: 60%;
  height: 60%;
  border-radius: inherit;
  background-image: repeating-linear-gradient(
      135deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      67.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      135deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      112.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      112.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      22.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      22.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      135deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      157.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      67.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    repeating-linear-gradient(
      67.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px
    ),
    linear-gradient(90deg, #ffeb12, #ffce00);
}

.flower__line {
  height: 55vmin;
  width: 1.5vmin;
  background-image: linear-gradient(
      to left,
      rgba(0, 0, 0, 0.2),
      transparent,
      rgba(255, 255, 255, 0.2)
    ),
    linear-gradient(to top, transparent 10%, #079097, #04e1e7);
  box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
  animation: grow-flower-tree 4s backwards;
}

.flower__line__leaf {
  --w: 7vmin;
  --h: calc(var(--w) * 0.4);
  position: absolute;
  width: var(--w);
  height: var(--h);
  border-top-right-radius: var(--h);
  border-bottom-right-radius: var(--h);
  background-image: linear-gradient(
    to top,
    rgba(20, 117, 122, 0.4),
    #04e1e7
  );
}

.flower__line__leaf--1 {
  top: 20%;
  left: 90%;
  transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--2 {
  top: 45%;
  left: 90%;
  transform-origin: left;
  transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--3 {
  top: 25%;
  left: -90%;
  transform: rotate(-70deg) rotateY(-30deg);
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
  border-top-left-radius: var(--h);
  border-bottom-left-radius: var(--h);
  background-image: linear-gradient(
    to top,
    rgba(20, 117, 122, 0.4),
    #04e1e7
  );
}

.flower__line__leaf--4 {
  top: 40%;
  left: -90%;
  transform-origin: right;
  transform: rotate(-70deg) rotateY(-30deg);
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
  border-top-left-radius: var(--h);
  border-bottom-left-radius: var(--h);
  background-image: linear-gradient(
    to top,
    rgba(20, 117, 122, 0.4),
    #04e1e7
  );
}

.flower__line__leaf--5 {
  top: 55%;
  left: 90%;
  transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--6 {
  top: 65%;
  left: -90%;
  transform: rotate(-70deg) rotateY(-30deg);
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
  border-top-left-radius: var(--h);
  border-bottom-left-radius: var(--h);
  background-image: linear-gradient(
    to top,
    rgba(20, 117, 122, 0.4),
    #04e1e7
  );
}

.flower__light {
  position: absolute;
  bottom: 0vmin;
  width: 1vmin;
  height: 1vmin;
  background-color: rgb(255, 251, 0);
  border-radius: 50%;
  filter: blur(0.2vmin);
  animation: light-ans 4s linear infinite backwards;
}

.flower__light:nth-child(odd) {
  background-color: #fffb00;
}

.flower__light--1 {
  left: -2vmin;
  animation-delay: 1s;
}

.flower__light--2 {
  left: 3vmin;
  animation-delay: 0.5s;
}

.flower__light--3 {
  left: -6vmin;
  animation-delay: 0.3s;
}

.flower__light--4 {
  left: 6vmin;
  animation-delay: 0.9s;
}

.flower__light--5 {
  left: -1vmin;
  animation-delay: 1.5s;
}

.flower__light--6 {
  left: -4vmin;
  animation-delay: 3s;
}

.flower__light--7 {
  left: 3vmin;
  animation-delay: 2s;
}

.flower__light--8 {
  left: -6vmin;
  animation-delay: 3.5s;
}

.flower__grass {
  --c: #159faa;
  --line-w: 1.5vmin;
  position: absolute;
  bottom: 12vmin;
  left: -7vmin;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 20;
  transform-origin: bottom center;
  transform: rotate(-48deg) rotateY(40deg);
}

.flower__grass--1 {
  animation: moving-grass 2s linear infinite;
}

.flower__grass--2 {
  left: 2vmin;
  bottom: 10vmin;
  transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
  opacity: 0.8;
  z-index: 0;
  animation: moving-grass--2 1.5s linear infinite;
}

.flower__grass--top {
  width: 7vmin;
  height: 10vmin;
  border-top-right-radius: 100%;
  border-right: var(--line-w) solid var(--c);
  transform-origin: bottom center;
  transform: rotate(-2deg);
}

.flower__grass--bottom {
  margin-top: -2.8vmin;
  width: var(--line-w);
  height: 15vmin;
  background-image: linear-gradient(to top, transparent, var(--c));
}

.flower__grass__leaf {
  --size: 10vmin;
  position: absolute;
  width: calc(var(--size) * 2.1);
  height: var(--size);
  border-radius: 100%;
  border-top: calc(var(--size) / 2) solid var(--c);
  border-right: 1vmin solid transparent;
  border-left: 1vmin solid transparent;
  transform-origin: center;
}

.flower__grass__leaf--1 {
  transform: rotate(-45deg) translate(1vmin, -2vmin);
}

.flower__grass__leaf--2 {
  transform: rotate(45deg) translate(-1vmin, -2vmin);
}

.flower__grass__leaf--3 {
  transform: rotate(45deg) translate(2vmin, -2.5vmin);
}

.flower__grass__leaf--4 {
  transform: rotate(-45deg) translate(-2vmin, -2.5vmin);
}

.flower__grass__leaf--5 {
  transform: rotate(45deg) translate(3vmin, -3.5vmin);
}

.flower__grass__leaf--6 {
  transform: rotate(-45deg) translate(-3vmin, -3.5vmin);
}

.flower__grass__leaf--7 {
  transform: rotate(45deg) translate(4vmin, -4.5vmin);
}

.flower__grass__leaf--8 {
  transform: rotate(-45deg) translate(-4vmin, -4.5vmin);
}

.flower__grass__overlay {
  position: absolute;
  top: -10%;
  right: 0%;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.6);
  filter: blur(1.5vmin);
  z-index: 100;
}

.flower__g-long {
  --w: 2vmin;
  --h: 6vmin;
  --c: #159faa;
  position: absolute;
  bottom: 10vmin;
  left: -3vmin;
  transform-origin: bottom center;
  transform: rotate(-30deg) rotateY(-20deg);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.flower__g-long__top {
  top: calc(var(--h) * -1);
  width: calc(var(--w) + 1vmin);
  height: var(--h);
  border-top-right-radius: 100%;
  border-right: 0.7vmin solid var(--c);
  transform: translate(-0.7vmin, 1vmin);
}

.flower__g-long__bottom {
  width: var(--w);
  height: 50vmin;
  background-image: linear-gradient(to top, transparent 40%, var(--c));
  box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
}

.flower__g-right {
  position: absolute;
  --w: 2.5vmin;
  bottom: 8vmin;
  left: 5vmin;
  transform-origin: bottom left;
  transform: rotate(20deg);
}

.flower__g-right .leaf {
  width: 30vmin;
  height: 50vmin;
  border-top-left-radius: 100%;
  border-left: 2vmin solid #079097;
  background-image: linear-gradient(
    to bottom,
    transparent,
    transparent 50%,
    rgba(0, 0, 0, 0.6)
  );
}

.flower__g-right--1 {
  animation: moving-grass 2.5s linear infinite;
}

.flower__g-right--2 {
  left: -10vmin;
  transform: rotate(20deg) rotateY(-180deg);
  animation: moving-grass--2 3s linear infinite;
}

.flower__g-right--2 .leaf {
  height: 55vmin;
  filter: blur(0.2vmin);
  opacity: 0.8;
}

.flower__g-front {
  position: absolute;
  bottom: 6vmin;
  left: 2.5vmin;
  z-index: 100;
  transform-origin: bottom center;
  transform: rotate(-28deg) rotateY(30deg) scale(1.04);
  animation: blooming-flower 3s backwards;
}

.flower__g-front__leaf-wrapper {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: bottom left;
  animation: blooming-leaf-right 2s backwards;
}

.flower__g-front__leaf-wrapper--1 {
  top: 1vmin;
  left: -0.5vmin;
  transform: rotate(120deg);
  animation-delay: 0.3s;
}

.flower__g-front__leaf-wrapper--2 {
  top: -1vmin;
  left: 0.5vmin;
  transform: rotate(80deg);
  animation-delay: 0.5s;
}

.flower__g-front__leaf-wrapper--3 {
  top: 0.5vmin;
  left: 1.5vmin;
  transform: rotate(40deg);
  animation-delay: 0.7s;
}

.flower__g-front__leaf-wrapper--4 {
  top: 1.5vmin;
  left: 2.5vmin;
  transform: rotate(0deg);
  animation-delay: 0.9s;
}

.flower__g-front__leaf-wrapper--5 {
  top: 2vmin;
  left: 3.5vmin;
  transform: rotate(-40deg);
  animation-delay: 1.1s;
}

.flower__g-front__leaf-wrapper--6 {
  top: 3vmin;
  left: 4.5vmin;
  transform: rotate(-80deg);
  animation-delay: 1.3s;
}

.flower__g-front__leaf-wrapper--7 {
  top: 4vmin;
  left: 5.5vmin;
  transform: rotate(-120deg);
  animation-delay: 1.5s;
}

.flower__g-front__leaf-wrapper--8 {
  top: 5vmin;
  left: 6.5vmin;
  transform: rotate(-160deg);
  animation-delay: 1.7s;
}

.flower__g-front__leaf {
  width: 10vmin;
  height: 10vmin;
  border-radius: 100% 0% 100% 100% / 100% 100% 0% 0%;
  background-image: linear-gradient(
    to bottom,
    transparent,
    var(--dark-color) 50%,
    transparent 100%
  );
  filter: blur(0.5vmin);
  background-color: #159faa;
}

.flower__g-front__leaf-wrapper + .flower__g-front__line {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 1.5vmin;
  height: 30vmin;
  background-image: linear-gradient(to top, transparent, #079097);
  transform-origin: bottom center;
  transform: rotate(-90deg) translateY(1vmin);
  animation: grow-flower-tree 2s backwards;
  animation-delay: 1.5s;
}

.flower__g-fr {
  position: absolute;
  bottom: 4vmin;
  left: 3vmin;
  transform-origin: bottom left;
  z-index: 10;
  animation: blooming-leaf-right 3s 1s backwards;
}

.flower__g-fr .leaf {
  width: 30vmin;
  height: 50vmin;
  border-top-left-radius: 100%;
  border-left: 2vmin solid #079097;
  -webkit-mask-image: linear-gradient(to top, transparent 40%, black);
  mask-image: linear-gradient(to top, transparent 40%, black);
}

.flower__g-fr__leaf {
  position: absolute;
  top: 0;
  left: 0;
  width: 10vmin;
  height: 10vmin;
  border-radius: 100% 0% 100% 100% / 100% 100% 0% 0%;
  background-color: #159faa;
  filter: blur(0.6vmin);
}

.flower__g-fr__leaf--1 {
  left: 20vmin;
  transform: rotate(45deg);
  animation-delay: 0.3s;
}

.flower__g-fr__leaf--2 {
  left: 12vmin;
  top: -7vmin;
  transform: rotate(25deg);
  animation-delay: 0.6s;
}

.flower__g-fr__leaf--3 {
  left: 15vmin;
  top: 6vmin;
  transform: rotate(55deg);
  animation-delay: 0.9s;
}

.flower__g-fr__leaf--4 {
  left: 6vmin;
  top: -2vmin;
  transform: rotate(-40deg);
  animation-delay: 1.2s;
}

.flower__g-fr__leaf--5 {
  left: 10vmin;
  top: 12vmin;
  transform: rotate(40deg);
  animation-delay: 1.5s;
}

.flower__g-fr__leaf--6 {
  left: 0vmin;
  top: 7vmin;
  transform: rotate(-20deg);
  animation-delay: 1.8s;
}

.flower__g-fr__leaf--7 {
  left: 5vmin;
  top: 18vmin;
  transform: rotate(10deg);
  animation-delay: 2.1s;
}

.flower__g-fr__leaf--8 {
  left: 2vmin;
  top: 25vmin;
  transform: rotate(-30deg);
  animation-delay: 2.4s;
}

.long-g {
  position: absolute;
  bottom: 25vmin;
  left: -42vmin;
  transform-origin: bottom left;
}

.long-g--1 {
  bottom: 0vmin;
  transform: scale(0.8) rotate(-5deg);
}

.long-g--1 .leaf {
  -webkit-mask-image: linear-gradient(
    to top,
    transparent 40%,
    #159faa 80%
  ) !important;
  mask-image: linear-gradient(to top, transparent 40%, #159faa 80%) !important;
}

.long-g--1 .leaf--1 {
  --w: 5vmin;
  --h: 60vmin;
  left: -5vmin;
  transform: rotate(20deg) rotateY(-20deg);
}

.long-g--2,
.long-g--3 {
  bottom: -3vmin;
  left: -35vmin;
  transform-origin: center;
  transform: scale(0.6) rotateX(60deg);
}
